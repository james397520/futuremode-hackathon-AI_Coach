name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a superseded run on the same ref. Cheap and it keeps queue times sane
# when someone pushes three fixups in a row. `main` is excluded from
# cancellation so a merge-queue run is never killed by the next merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Keep in sync with .nvmrc, infra/docker/web.Dockerfile and the
  # `packageManager` field in package.json.
  NODE_VERSION: "20.18.0"
  PYTHON_VERSION: "3.11"
  FORCE_COLOR: "1"

jobs:
  # ===========================================================================
  # web — apps/web + packages/*
  #
  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │ THE LOCKFILE IS A HARD PRECONDITION                                     │
  # │                                                                         │
  # │ `pnpm install --frozen-lockfile` requires a committed pnpm-lock.yaml.   │
  # │ Without one this job fails immediately with                             │
  # │   ERR_PNPM_NO_LOCKFILE  Cannot install with "frozen-lockfile" because   │
  # │   pnpm-lock.yaml is absent                                              │
  # │                                                                         │
  # │ That was the state when this workflow was written, and the fix is one   │
  # │ local command, once:                                                    │
  # │   pnpm install && git add pnpm-lock.yaml && git commit                  │
  # │ The "Assert a lockfile exists" step below turns the failure into a      │
  # │ readable message instead of a pnpm error code.                          │
  # │                                                                         │
  # │ We deliberately do NOT soften this to a plain `pnpm install`. A CI job  │
  # │ that resolves versions itself is not reproducible: it can pass on a     │
  # │ patch release nobody has ever run locally, and it would silently paper  │
  # │ over a lockfile a PR forgot to update. `continue-on-error` stays false  │
  # │ everywhere in this file for the same reason.                            │
  # └─────────────────────────────────────────────────────────────────────────┘
  # ===========================================================================
  web:
    name: web (typecheck · lint · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      # corepack activates the pnpm version pinned by package.json's
      # `packageManager` field, so CI and every developer machine agree.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # setup-node's built-in pnpm cache keys on pnpm-lock.yaml and caches
          # the pnpm store, which is the right granularity for a workspace.
          cache: pnpm

      - name: Assert a lockfile exists
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error title=Missing pnpm-lock.yaml::Run 'pnpm install' locally and commit pnpm-lock.yaml. See the comment above the 'web' job in .github/workflows/ci.yml."
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      # Typecheck first: it is the fastest way to surface a contract change that
      # packages/shared-types made and apps/web has not absorbed.
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Build
        run: pnpm -r build

      # Guard §96: the WebGPU / ML runtime must not land in the initial bundle.
      # Advisory only — it prints, it does not gate — because the budget
      # numbers belong to the web team, not to CI.
      - name: Bundle report (advisory)
        if: always()
        run: |
          if [ -d apps/web/.next ]; then
            echo "### Next.js build output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            du -sh apps/web/.next 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
            find apps/web/.next/static/chunks -name '*.js' -size +200k 2>/dev/null \
              | head -20 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "Spec §96: dynamic-import the local-inference runtime; it must not be in the initial bundle." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ===========================================================================
  # api — apps/api
  #
  # Service containers mirror infra/docker-compose.yml. They exist because the
  # tests that matter here are the tenant-isolation ones (§74), and those are
  # only meaningful against a real Postgres with real constraints.
  # ===========================================================================
  api:
    name: api (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: false

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aicoach
          POSTGRES_PASSWORD: aicoach
          POSTGRES_DB: aicoach_test
        ports: ["5432:5432"]
        # GitHub's `options` are docker run flags; this is the same probe as
        # the compose healthcheck.
        options: >-
          --health-cmd "pg_isready -U aicoach -d aicoach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333", "6334:6334"]
        # The Qdrant image ships no curl/wget, so the probe is bash's /dev/tcp.
        # Identical reasoning to infra/docker-compose.yml — see the comment
        # there before changing either.
        options: >-
          --health-cmd "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://aicoach:aicoach@localhost:5432/aicoach_test
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      # Object storage is not a service container: the tests that touch S3 use
      # a stubbed client. Spinning MinIO up for every run buys little.
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: ai-coach-test
      # Not a secret — a fixed test value long enough to satisfy the
      # >=32-character check in app/core/config.py.
      JWT_SECRET: ci-test-secret-not-used-anywhere-real-0001
      # No provider keys in CI. Anything reaching OpenAI/ElevenLabs must be
      # mocked; a test that needs a live key is a test in the wrong place.
      LLM_PROVIDER: none
      TTS_PROVIDER: none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          # setup-python's pip cache keys on the dependency files it is told
          # about. Without this it hashes requirements*.txt, which we do not
          # have, and the cache would never hit.
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # Lint before types: ruff is seconds, mypy is tens of seconds, and ruff
      # catches the import-order and unused-import noise that would otherwise
      # clutter the mypy output.
      - name: Ruff (lint)
        working-directory: apps/api
        run: ruff check --output-format=github .

      - name: Ruff (format check)
        working-directory: apps/api
        run: ruff format --check .

      - name: Mypy
        working-directory: apps/api
        run: mypy

      # Migrations before tests: this also proves the migration chain actually
      # applies to an empty database, which a test-only `create_all` would hide.
      - name: Alembic upgrade head
        working-directory: apps/api
        run: |
          if [ -f alembic.ini ]; then
            alembic upgrade head
          else
            echo "::notice title=No alembic.ini::Migrations not present yet; skipping."
          fi

      - name: Pytest
        working-directory: apps/api
        run: pytest -ra --tb=short

  # ===========================================================================
  # contracts — the cross-language drift guard
  #
  # Its own job on purpose. It needs no toolchain, finishes in about a second,
  # and it is the check most likely to catch a genuinely expensive bug (see
  # docs/adr/0002). Keeping it independent means it still reports even when the
  # web or api job is red for an unrelated reason.
  # ===========================================================================
  contracts:
    name: contracts (TS ↔ Pydantic)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Streaming-event contract drift
        run: infra/scripts/check-contracts.sh

      - name: Report
        if: always()
        run: |
          {
            echo "### Streaming-event contract"
            echo '```'
            infra/scripts/check-contracts.sh --list 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # shell — the infra scripts are load-bearing; a syntax error in bootstrap.sh
  # is a broken onboarding for everyone.
  # ===========================================================================
  shell:
    name: shell (shellcheck · compose validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          for f in infra/scripts/*.sh infra/docker/postgres/init/*.sh; do
            bash -n "$f" && echo "ok  $f"
          done

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning \
            infra/scripts/*.sh \
            infra/docker/postgres/init/*.sh

      # `config` fully resolves interpolation, profiles, anchors and
      # depends_on, so this catches a typo that `up` would only find at 3am.
      - name: Validate docker-compose
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/docker-compose.yml config >/dev/null
          docker compose --env-file .env -f infra/docker-compose.yml --profile app --profile proxy config >/dev/null
          echo "compose config valid (default, app, proxy profiles)"

      - name: Seed script self-check
        run: python3 infra/scripts/seed.py --dry-run

  # ===========================================================================
  # A single required status check for branch protection. Protect this one job
  # instead of listing five, so adding a job later does not need a settings
  # change — and so a skipped-but-required job can never block a merge.
  # ===========================================================================
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [web, api, contracts, shell]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          results='${{ join(needs.*.result, ",") }}'
          echo "job results: $results"
          case "$results" in
            *failure*|*cancelled*) echo "::error::one or more CI jobs did not succeed"; exit 1 ;;
            *) echo "all CI jobs succeeded" ;;
          esac
