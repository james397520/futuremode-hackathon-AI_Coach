name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 03:17 UTC. An odd minute on purpose — the top of the hour is the
    # busiest slot on GitHub's shared runners and scheduled jobs get delayed.
    # A weekly run is what catches an advisory published against a dependency
    # nobody has touched in a month.
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# =============================================================================
# Scope of this file — and what it is NOT
#
# Everything here is automated, in-repo scanning: dependency advisories, secret
# scanning, and static analysis. That is the floor, not the ceiling.
#
# Spec §41 and §100 both call for an EXTERNAL security audit before the
# platform handles real enterprise data. The spec is careful about how that is
# described, and so are we: the intended engagement is with
# **CertiK or an equivalent external security audit provider**, covering the
# API surface and infrastructure. §41 notes explicitly that CertiK is known
# primarily for Web3 / blockchain security, so for a general enterprise AI SaaS
# the proposal should claim only the scope that can actually be demonstrated —
# and until an engagement exists, say "or equivalent provider" rather than
# naming one. Findings from such an audit surface in the product under
# Security & Audit (§41), as ComplianceFinding-shaped rows with severity,
# component, scan time, status and resolution.
#
# See docs/ROADMAP.md, Phase 3, for where this sits in the plan. Nothing in
# this workflow should be read as a substitute for it.
# =============================================================================

jobs:
  # ===========================================================================
  # Dependency review — PR-only. Blocks a PR that introduces a dependency with
  # a known high-severity advisory, or an incompatible licence.
  # ===========================================================================
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          # `high` rather than `moderate`: at moderate this action is noisy
          # enough on a JS dependency tree that people learn to ignore it,
          # which is worse than a higher threshold they actually read.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Copyleft licences are incompatible with a proprietary distribution
          # (apps/api declares `license = { text = "Proprietary" }`).
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0, GPL-2.0, SSPL-1.0

  # ===========================================================================
  # Python dependency audit
  # ===========================================================================
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install project + pip-audit
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install pip-audit

      # Audits the resolved environment, not the declared ranges — so it sees
      # transitive dependencies, which is where the advisories actually live.
      - name: Audit
        working-directory: apps/api
        run: |
          pip-audit \
            --strict \
            --progress-spinner off \
            --format columns \
            --desc on \
            | tee /tmp/pip-audit.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "### pip-audit"
            echo '```'
            cat /tmp/pip-audit.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # JS dependency audit
  # ===========================================================================
  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.0"
          cache: pnpm

      # Same lockfile precondition as the `web` job in ci.yml: `pnpm audit`
      # reads pnpm-lock.yaml, so it cannot run before the first
      # `pnpm install` has been committed.
      - name: Audit
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::warning title=No lockfile::pnpm-lock.yaml is absent, so there is nothing to audit. Run 'pnpm install' locally and commit the lockfile."
            exit 0
          fi
          pnpm install --frozen-lockfile --ignore-scripts
          # --audit-level high for the same signal-to-noise reason as
          # dependency-review above. `|| true` on the JSON dump only; the
          # gating run below is what decides the job.
          pnpm audit --json > /tmp/pnpm-audit.json || true
          pnpm audit --audit-level high

      - name: Summary
        if: always()
        run: |
          {
            echo "### pnpm audit"
            echo '```json'
            head -c 8000 /tmp/pnpm-audit.json 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Secret scanning
  #
  # This is the highest-stakes check in the file. §56 / §70 / §71 are explicit
  # that OpenAI and ElevenLabs credentials must never reach the browser, and the
  # way that rule gets broken in practice is not a considered decision — it is
  # a key pasted into a .env that gets committed, or into a NEXT_PUBLIC_* var.
  # ===========================================================================
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret that was committed and then "removed" in a
          # later commit is still in the pack and still compromised. depth 0 is
          # the only setting that finds it.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required by the action for organisation
          # accounts only. It is absent on personal repos, where the action
          # runs unlicensed; do not add a fake value.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

      # A targeted check on top of gitleaks' generic rules, for the specific
      # mistake this codebase is shaped to make.
      - name: No provider keys under NEXT_PUBLIC_
        if: always()
        run: |
          # NEXT_PUBLIC_* is inlined into the client bundle by Next.js. Any
          # credential-shaped name in that namespace is a browser-exposed
          # secret by construction, regardless of its current value.
          if grep -rInE 'NEXT_PUBLIC_[A-Z0-9_]*(KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL)' \
               --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
               --include='*.json' --include='*.yml' --include='*.yaml' --include='.env*' \
               --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git . ; then
            echo "::error title=Browser-exposed secret::A credential-shaped variable is in the NEXT_PUBLIC_ namespace, which Next.js inlines into the client bundle. Spec §56/§70/§71: provider keys are server-side only. Move it out of NEXT_PUBLIC_ and read it in apps/api."
            exit 1
          fi
          echo "ok — no credential-shaped NEXT_PUBLIC_ variables"

      - name: No committed .env
        if: always()
        run: |
          # .gitignore covers this, but a `git add -f` does not care.
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error title=.env is tracked::The root .env holds real credentials and must never be committed. Run 'git rm --cached .env'."
            exit 1
          fi
          echo "ok — .env is not tracked"

  # ===========================================================================
  # CodeQL — static analysis for JS/TS and Python.
  #
  # A matrix rather than one job: the two extractors have different build
  # requirements and very different runtimes, and a failure in one should not
  # hide the results of the other.
  # ===========================================================================
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
          - language: python

    steps:
      - uses: actions/checkout@v4

      # --- language toolchains --------------------------------------------
      # CodeQL's JS extractor works on source and needs no install step, but
      # resolving workspace imports gives it a materially better call graph —
      # so install when a lockfile exists, and carry on when it does not.
      - name: Enable corepack
        if: matrix.language == 'javascript-typescript'
        run: corepack enable

      - uses: actions/setup-node@v4
        if: matrix.language == 'javascript-typescript'
        with:
          node-version: "20.18.0"
          cache: pnpm

      - uses: actions/setup-python@v5
        if: matrix.language == 'python'
        with:
          python-version: "3.11"

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality over the default `security` pack: it adds the
          # correctness queries, and on a codebase this young they are worth
          # the extra minutes.
          queries: security-and-quality

      - name: Resolve JS workspace (best effort)
        if: matrix.language == 'javascript-typescript'
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile --ignore-scripts
          else
            echo "::notice title=No lockfile::Analysing without installed dependencies; cross-package resolution will be partial."
          fi

      - name: Install Python deps (best effort)
        if: matrix.language == 'python'
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' || echo "::notice::Dependency install failed; CodeQL will analyse without them."

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ===========================================================================
  # Single required status check, same pattern as ci.yml.
  #
  # `dependency-review` is skipped on push and on schedule, and a *skipped*
  # result must not fail the gate — hence the explicit case match rather than
  # `needs.*.result == 'success'`.
  # ===========================================================================
  security:
    name: security
    runs-on: ubuntu-latest
    needs: [dependency-review, pip-audit, pnpm-audit, gitleaks, codeql]
    if: always()
    steps:
      - name: Verify no job failed
        run: |
          results='${{ join(needs.*.result, ",") }}'
          echo "job results: $results"
          case "$results" in
            *failure*|*cancelled*) echo "::error::one or more security jobs did not succeed"; exit 1 ;;
            *) echo "security checks passed (skipped jobs are not failures)" ;;
          esac
