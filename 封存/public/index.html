<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARKit 52 Avatar Viewer — V0</title>
<style>
  :root {
    --bg: #101318;
    --panel: #181d25;
    --panel2: #1f2530;
    --text: #e8ecf1;
    --muted: #8a94a3;
    --accent: #4f8cff;
    --accent2: #35c28f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; overflow: hidden; }
  #app { display: flex; height: 100%; }
  #stage { flex: 1; position: relative; min-width: 0; }
  #stage canvas { display: block; }
  #hud { position: absolute; left: 12px; top: 12px; background: rgba(16,19,24,.72);
    border: 1px solid #2a3240; border-radius: 8px; padding: 8px 12px; font-size: 12px;
    color: var(--muted); pointer-events: none; white-space: pre; }
  #drophint { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--muted);
    background: rgba(16,19,24,.6); padding: 6px 10px; border-radius: 6px; pointer-events: none; }
  #panel { width: 340px; background: var(--panel); border-left: 1px solid #262e3a;
    overflow-y: auto; padding: 14px; flex-shrink: 0; }
  h1 { font-size: 15px; margin-bottom: 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  section { background: var(--panel2); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  section h2 { font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .06em; margin-bottom: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button { background: #2a3342; color: var(--text); border: 1px solid #38445a;
    border-radius: 7px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  button:hover { background: #33405a; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.1); }
  button.active { background: var(--accent2); border-color: var(--accent2); color: #08281c; }
  label.toggle { display: flex; align-items: center; gap: 6px; font-size: 13px;
    color: var(--text); cursor: pointer; margin: 3px 0; }
  details { margin: 6px 0; }
  summary { cursor: pointer; font-size: 13px; color: var(--accent); padding: 3px 0; }
  .slider-row { display: grid; grid-template-columns: 130px 1fr 34px; align-items: center;
    gap: 8px; margin: 2px 0; font-size: 11.5px; }
  .slider-row .name { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slider-row .val { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 4px; }
  #progress { height: 5px; background: #2a3240; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  #progress > div { height: 100%; width: 0%; background: var(--accent); }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; background: var(--bg); z-index: 10; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="loading">載入模型中…</div>
    <div id="hud"></div>
    <div id="drophint">可將自己的 .glb(ARKit morph targets)或 .vrm 直接拖進畫面替換模型</div>
  </div>
  <div id="panel">
    <h1>ARKit 52 Avatar — V0</h1>
    <div class="sub">Audio2Expression 介面驗證:52 維係數 → morphTargetInfluences</div>

    <section>
      <h2>模型</h2>
      <div class="row" id="modelBtns"></div>
    </section>

    <section>
      <h2>動畫播放</h2>
      <div class="row">
        <button id="btnPlayJson" class="primary">▶ 播放 A2E 範例(JSON)</button>
        <button id="btnPlayTake">▶ 內建臉捕 Take</button>
        <button id="btnStop">■ 停止</button>
      </div>
      <div id="progress"><div></div></div>
    </section>

    <section>
      <h2>情緒 Preset(疊加在說話之上)</h2>
      <div class="row" id="emotions"></div>
    </section>

    <section>
      <h2>Idle 行為(procedural)</h2>
      <label class="toggle"><input type="checkbox" id="ckBlink" checked> 自動眨眼</label>
      <label class="toggle"><input type="checkbox" id="ckGaze" checked> 視線微動(眼球節點)</label>
      <label class="toggle"><input type="checkbox" id="ckHead" checked> 頭部微動</label>
    </section>

    <section>
      <h2>手動 Blendshapes(52)</h2>
      <div class="row" style="margin-bottom:6px">
        <button id="btnReset">全部歸零</button>
      </div>
      <div id="sliders"></div>
    </section>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/jsm/loaders/GLTFLoader.js';
import { KTX2Loader } from './vendor/jsm/loaders/KTX2Loader.js';
import { MeshoptDecoder } from './vendor/jsm/libs/meshopt_decoder.module.js';
import { OrbitControls } from './vendor/jsm/controls/OrbitControls.js';
import { VRMLoaderPlugin, VRMUtils } from './vendor/three-vrm.module.js';

// ---------- 基本場景 ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151a22);

const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3226, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(1.5, 1.8, 2.5); scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.7); fill.position.set(-2, 0.5, 1); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xffe0c0, 1.0); rim.position.set(0, 1.5, -2.5); scene.add(rim);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// ---------- 狀態 ----------
let model = null;            // gltf.scene
let morphMeshes = [];        // 所有含 morphTargetDictionary 的 mesh
let modelKeys = [];          // 模型實際的 morph 名稱
let eyeNodes = [];           // { node, restQ } 眼球節點/骨骼(gaze 用)
let headBone = null;         // Head 骨骼(RPM 類模型的頭部微動)
let headRestQ = null;
let vrm = null;              // three-vrm 實例(VRM 模型時非 null)
let gazeObj = null;          // VRM lookAt 目標
let mixer = null, takeActions = [];
let bodyAction = null;        // 身體待機骨骼動畫(修正 Avaturn A/T-pose 手臂),與 take/compose 模式無關,一律播放
let mode = 'compose';        // 'compose' | 'take'
// 匹配軀幹/四肢骨骼名稱:只把「姿勢矯正」用的骨骼軌跡抽出來一律播放,
// 刻意不含 Head/Eye,避免和自己的頭部微動、視線 saccade 打架
const BODY_POSE_BONE = /^(Hips|Spine\d*|(Left|Right)(Shoulder|Arm|ForeArm|Hand(Index|Middle|Pinky|Ring|Thumb)?\d*|UpLeg|Leg|Foot|ToeBase))$/i;

// 圖層:最終值 = manual + speech(嘴部mask) + emotion(平滑) ,眨眼取 max
const layers = {
  manual: {},                // slider 值(以模型 key 為準)
  speech: {},                // JSON 播放當前 frame(以模型 key 為準)
  emotionTarget: {},         // preset 目標
  emotionCur: {},            // 平滑後
};

// 說話 mask:嘴部/顎/舌以 lipsync 為主,情緒只保留一小部分權重疊加(而非完全歸零),
// 否則微笑/生氣/難過…等情緒最有辨識度的嘴角形狀在講話時會完全被蓋掉,变得毫無區別
const SPEECH_REGION = /^(jaw|mouth|tongue)/;
const SPEECH_MASK_WEIGHT = 0.35;

// ARKit 標準名 → 模型 key(facecap 用 _L/_R 慣例)
const nameCache = {};
function resolveKey(dict, arkitName) {
  const hit = nameCache[arkitName];
  if (hit !== undefined) return hit;
  let k = null;
  if (arkitName in dict) k = arkitName;
  else if (arkitName.endsWith('Left') && (arkitName.slice(0, -4) + '_L') in dict) k = arkitName.slice(0, -4) + '_L';
  else if (arkitName.endsWith('Right') && (arkitName.slice(0, -5) + '_R') in dict) k = arkitName.slice(0, -5) + '_R';
  nameCache[arkitName] = k;
  return k;
}

// ---------- 載入模型 ----------
// facecap.glb 使用 KTX2 貼圖 + meshopt 壓縮,需掛上對應 decoder
const ktx2 = new KTX2Loader()
  .setTranscoderPath('./vendor/jsm/libs/basis/')
  .detectSupport(renderer);
const loader = new GLTFLoader()
  .setKTX2Loader(ktx2)
  .setMeshoptDecoder(MeshoptDecoder);
loader.register(parser => new VRMLoaderPlugin(parser));   // .vrm 也走同一個 loader

function bindModel(gltf) {
  if (model) scene.remove(model);
  model = gltf.scene;
  scene.add(model);

  vrm = gltf.userData.vrm || null;
  if (vrm) VRMUtils.rotateVRM0(vrm);        // VRM 0.x 面向修正

  morphMeshes = [];
  eyeNodes = [];
  headBone = null; headRestQ = null;
  model.traverse(o => {
    if (o.isMesh && o.morphTargetDictionary) {
      morphMeshes.push(o);
      o.frustumCulled = false;                       // skinned mesh 邊界不準時避免消失
    }
    const nm = o.name || '';
    // 眼球:facecap 用非 skinned 的 eyeLeft/eyeRight 節點;RPM 用 LeftEye/RightEye 骨骼
    if (/^(eye(Left|Right)|(Left|Right)Eye)$/i.test(nm) && !o.isSkinnedMesh)
      eyeNodes.push({ node: o, restQ: o.quaternion.clone() });
    if (/^head$/i.test(nm) && o.isBone && !headBone) {
      headBone = o; headRestQ = o.quaternion.clone();
    }
  });
  // 主要臉 mesh:morph 數最多者中,取頂點數最大的(避免選到眼球小 mesh)
  const maxT = Math.max(...morphMeshes.map(m => Object.keys(m.morphTargetDictionary).length), 0);
  const faceMesh = morphMeshes
    .filter(m => Object.keys(m.morphTargetDictionary).length === maxT)
    .reduce((a, b) => (!a || b.geometry.attributes.position.count > a.geometry.attributes.position.count) ? b : a, null);
  modelKeys = faceMesh ? Object.keys(faceMesh.morphTargetDictionary) : [];
  if (faceMesh) morphMeshes = [faceMesh, ...morphMeshes.filter(m => m !== faceMesh)];

  if (vrm) {
    // VRM:改用 expressionManager 驅動;sliders 列出 VRM 表情名
    modelKeys = Object.keys(vrm.expressionManager.expressionMap);
    eyeNodes = [];                                     // 視線交給 vrm.lookAt
    headBone = vrm.humanoid.getNormalizedBoneNode('head');
    headRestQ = headBone ? headBone.quaternion.clone() : null;
    if (!gazeObj) { gazeObj = new THREE.Object3D(); scene.add(gazeObj); }
    if (vrm.lookAt) vrm.lookAt.target = gazeObj;
  }

  // 內建動畫
  mixer = new THREE.AnimationMixer(model);
  takeActions = (gltf.animations || []).map(c => mixer.clipAction(c));
  document.getElementById('btnPlayTake').disabled = !takeActions.length;
  document.getElementById('btnPlayTake').style.opacity = takeActions.length ? 1 : 0.4;

  // 身體待機姿勢:從內建 clip 抽出軀幹/四肢骨骼軌跡,一律播放(修正 Avaturn 匯出的
  // A-pose/T-pose 手臂張開問題),與 compose/take 模式無關;臉部 morph 軌跡則保留給
  // 「內建臉捕 Take」按鈕單獨觸發,避免同一批骨骼被兩個 action 重複驅動而打架
  bodyAction = null;
  const bodyTracks = [];
  for (const clip of gltf.animations || []) {
    for (const track of clip.tracks) {
      const bone = track.name.split('.')[0];
      if (BODY_POSE_BONE.test(bone)) bodyTracks.push(track);
    }
  }
  if (bodyTracks.length) {
    bodyAction = mixer.clipAction(new THREE.AnimationClip('idle-body-pose', -1, bodyTracks));
    bodyAction.play();
  }

  // 攝影機自動取景:優先對準臉部 mesh;沒有 morph target 的全身模型(如無 blendshape 的
  // Avaturn 匯出)則改用 Head 骨骼位置估算頭部範圍,避免拍成全身照
  model.updateMatrixWorld(true);
  let box;
  if (faceMesh) {
    box = new THREE.Box3().setFromObject(faceMesh);
  } else if (headBone && !vrm) {
    const headPos = new THREE.Vector3();
    headBone.getWorldPosition(headPos);
    const bodyHeight = new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3()).y;
    const h = bodyHeight / 7.5, half = h / 2;                    // 人體約 7.5 個頭高
    box = new THREE.Box3(
      new THREE.Vector3(headPos.x - half, headPos.y, headPos.z - half),
      new THREE.Vector3(headPos.x + half, headPos.y + h, headPos.z + half)
    );
  } else {
    box = new THREE.Box3().setFromObject(model);
  }
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const target = center.clone();
  const dist = Math.max(size.y, size.x) * 1.6 / Math.tan(camera.fov * Math.PI / 360);
  camera.position.set(target.x + dist * 0.2, target.y + size.y * 0.15, target.z + dist);
  controls.target.copy(target);
  camera.near = dist / 100; camera.far = dist * 100;
  camera.updateProjectionMatrix();

  buildSliders();
  document.getElementById('loading').style.display = 'none';
  console.log('[avatar] morph keys:', modelKeys.length, modelKeys);
}

// ---------- 模型清單與切換 ----------
const MODELS = [
  { label: '動漫女性・西裝', file: 'avatar_a_suit.vrm' },
  { label: '動漫男性・西裝', file: 'avatar_m_suit.vrm' },
];
const modelBtnRoot = document.getElementById('modelBtns');
const modelBtns = [];
function loadModel(file) {
  const loading = document.getElementById('loading');
  loading.style.display = 'flex';
  loading.textContent = '載入模型中…';
  stopAll();
  for (const k in nameCache) delete nameCache[k];
  layers.manual = {}; layers.speech = {}; layers.emotionCur = {};
  loader.load('./models/' + file, g => {
    bindModel(g);
    modelBtns.forEach(b => b.classList.toggle('active', b.dataset.file === file));
  }, undefined, e => { loading.textContent = '模型載入失敗:' + (e.message || e); });
}
for (const m of MODELS) {
  const b = document.createElement('button');
  b.textContent = m.label; b.dataset.file = m.file;
  b.onclick = () => loadModel(m.file);
  modelBtns.push(b); modelBtnRoot.appendChild(b);
}

// 拖放自訂 GLB
stage.addEventListener('dragover', e => e.preventDefault());
stage.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (!f || !/\.(glb|vrm)$/i.test(f.name)) return;
  f.arrayBuffer().then(buf => loader.parse(buf, '', g => {
    for (const k in nameCache) delete nameCache[k];
    stopAll(); bindModel(g);
  }, err => alert('GLB 解析失敗:' + err)));
});

// ---------- 52 sliders ----------
const GROUPS = [
  ['眉 Brow', /^brow/], ['眼 Eye', /^eye/], ['顎 Jaw', /^jaw/],
  ['嘴 Mouth', /^mouth/], ['頰/鼻/舌 Cheek+', /^(cheek|nose|tongue)/],
  ['口型 Visemes', /^viseme/],
  ['VRM 表情', /^(aa|ih|ou|ee|oh|happy|angry|sad|relaxed|surprised|neutral|blink|look)/],
  ['其他 Other', /./],
];
const sliderInputs = {};
function buildSliders() {
  const root = document.getElementById('sliders');
  root.innerHTML = '';
  for (const k in sliderInputs) delete sliderInputs[k];
  const used = new Set();
  for (const [label, re] of GROUPS) {
    const keys = modelKeys.filter(k => !used.has(k) && re.test(k));
    keys.forEach(k => used.add(k));
    if (!keys.length) continue;
    const det = document.createElement('details');
    const sum = document.createElement('summary');
    sum.textContent = `${label}(${keys.length})`;
    det.appendChild(sum);
    for (const k of keys) {
      const row = document.createElement('div'); row.className = 'slider-row';
      const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = k;
      const inp = document.createElement('input');
      inp.type = 'range'; inp.min = 0; inp.max = 1; inp.step = 0.01; inp.value = 0;
      const val = document.createElement('div'); val.className = 'val'; val.textContent = '0';
      inp.addEventListener('input', () => {
        layers.manual[k] = +inp.value;
        val.textContent = (+inp.value).toFixed(2);
      });
      sliderInputs[k] = { inp, val };
      row.append(nm, inp, val); det.appendChild(row);
    }
    root.appendChild(det);
  }
}
document.getElementById('btnReset').onclick = () => {
  layers.manual = {};
  for (const k in sliderInputs) { sliderInputs[k].inp.value = 0; sliderInputs[k].val.textContent = '0'; }
};

// ---------- 情緒 presets(ARKit 標準名)----------
const EMOTIONS = {
  '中性': {},
  '微笑': { mouthSmileLeft:.55, mouthSmileRight:.5, cheekSquintLeft:.3, cheekSquintRight:.3,
            eyeSquintLeft:.15, eyeSquintRight:.15, browInnerUp:.1 },
  '懷疑': { browDownLeft:.55, browDownRight:.2, browInnerUp:.2, eyeSquintLeft:.4, eyeSquintRight:.2,
            mouthPressLeft:.4, mouthPressRight:.4, mouthLeft:.2, noseSneerLeft:.15 },
  '驚訝': { browInnerUp:.7, browOuterUpLeft:.6, browOuterUpRight:.6, eyeWideLeft:.6, eyeWideRight:.6,
            jawOpen:.25, mouthFunnel:.2 },
  '生氣': { browDownLeft:.8, browDownRight:.8, eyeSquintLeft:.4, eyeSquintRight:.4,
            noseSneerLeft:.4, noseSneerRight:.4, mouthFrownLeft:.4, mouthFrownRight:.4,
            mouthPressLeft:.3, mouthPressRight:.3, jawForward:.2 },
  '難過': { browInnerUp:.7, mouthFrownLeft:.5, mouthFrownRight:.5, mouthShrugLower:.3,
            eyeLookDownLeft:.2, eyeLookDownRight:.2 },
};
const emoRoot = document.getElementById('emotions');
let emoButtons = {};
for (const name of Object.keys(EMOTIONS)) {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => {
    layers.emotionTarget = EMOTIONS[name];
    for (const k in emoButtons) emoButtons[k].classList.toggle('active', k === name);
  };
  emoButtons[name] = b; emoRoot.appendChild(b);
}
emoButtons['中性'].classList.add('active');

// ---------- A2E JSON 播放器(LAM-A2E 介面:fps + names[52] + frames[N][52])----------
let a2e = null, a2ePlaying = false, a2eTime = 0;
const progressBar = document.querySelector('#progress > div');

async function loadA2E() {
  if (a2e) return a2e;
  const res = await fetch('./sample_a2e.json');
  a2e = await res.json();
  return a2e;
}
document.getElementById('btnPlayJson').onclick = async () => {
  await loadA2E(); stopTake();
  mode = 'compose'; a2eTime = 0; a2ePlaying = true;
};
document.getElementById('btnPlayTake').onclick = () => {
  if (!takeActions.length) return;
  a2ePlaying = false; layers.speech = {};
  mode = 'take';
  if (bodyAction) bodyAction.stop();     // 完整 take clip 本身含軀幹軌跡,避免與待機姿勢重複驅動
  takeActions.forEach(a => a.reset().play());
};
document.getElementById('btnStop').onclick = stopAll;
function stopTake() { takeActions.forEach(a => a.stop()); }
function stopAll() {
  a2ePlaying = false; a2eTime = 0; layers.speech = {};
  stopTake(); mode = 'compose'; progressBar.style.width = '0%';
  if (bodyAction) bodyAction.play();     // 恢復待機姿勢
}

function sampleA2E(dt) {
  if (!a2ePlaying || !a2e || (!vrm && !morphMeshes.length)) return;
  a2eTime += dt;
  const dur = a2e.frames.length / a2e.fps;
  if (a2eTime >= dur) a2eTime -= dur;                 // loop
  const x = a2eTime * a2e.fps;
  const i0 = Math.floor(x) % a2e.frames.length;
  const i1 = (i0 + 1) % a2e.frames.length;
  const t = x - Math.floor(x);
  const dict = morphMeshes.length ? morphMeshes[0].morphTargetDictionary : {};
  const f0 = a2e.frames[i0], f1 = a2e.frames[i1];
  layers.speech = {};
  for (let j = 0; j < a2e.names.length; j++) {
    const v = f0[j] + (f1[j] - f0[j]) * t;            // 幀間線性插值
    if (v <= 0.001) continue;
    if (vrm) { layers.speech[a2e.names[j]] = v; continue; }   // VRM:保留 ARKit 名
    const k = resolveKey(dict, a2e.names[j]);
    if (k) layers.speech[k] = v;
  }
  progressBar.style.width = (a2eTime / dur * 100).toFixed(1) + '%';
}

// ---------- ARKit 52 → VRM 表情映射 ----------
function arkitToVrm(m, blink) {
  const g = n => m[n] || 0;
  const c = v => Math.min(1, Math.max(0, v));
  return {
    aa: c(g('jawOpen') * 1.15),
    ou: c(Math.max(g('mouthPucker'), g('mouthFunnel')) * 1.1),
    ih: c((g('mouthStretchLeft') + g('mouthStretchRight')) * 0.5),
    ee: c((g('mouthUpperUpLeft') + g('mouthUpperUpRight')) * 0.5),
    happy: c((g('mouthSmileLeft') + g('mouthSmileRight')) * 0.6 + (g('cheekSquintLeft') + g('cheekSquintRight')) * 0.15),
    angry: c((g('browDownLeft') + g('browDownRight')) * 0.5 + (g('noseSneerLeft') + g('noseSneerRight')) * 0.25),
    sad: c(g('browInnerUp') * 0.5 + (g('mouthFrownLeft') + g('mouthFrownRight')) * 0.45),
    surprised: c((g('eyeWideLeft') + g('eyeWideRight')) * 0.5 + g('browOuterUpLeft') * 0.3),
    relaxed: c((g('eyeSquintLeft') + g('eyeSquintRight')) * 0.35),
    blinkLeft: c(Math.max(g('eyeBlinkLeft'), blink)),
    blinkRight: c(Math.max(g('eyeBlinkRight'), blink)),
  };
}

// ---------- Idle:眨眼 / 視線 / 頭部微動 ----------
const ck = id => document.getElementById(id).checked;
let blinkT = 1.5, blinkPhase = -1;
let gazeT = 0, gazeTarget = new THREE.Vector2(), gazeCur = new THREE.Vector2();
function idleUpdate(dt, time) {
  // 眨眼(獨立通道,與其他圖層取 max)
  let blink = 0;
  if (ck('ckBlink') && mode === 'compose') {
    blinkT -= dt;
    if (blinkT <= 0 && blinkPhase < 0) { blinkPhase = 0; blinkT = 1.5 + Math.random() * 3.5; }
    if (blinkPhase >= 0) {
      blinkPhase += dt / 0.14;
      blink = Math.sin(Math.min(blinkPhase, 1) * Math.PI);
      if (blinkPhase >= 1) blinkPhase = -1;
    }
  }
  // 視線 saccade(以綁定時的 rest 姿態為基準疊加小角度)
  if (ck('ckGaze') && (eyeNodes.length || vrm)) {
    gazeT -= dt;
    if (gazeT <= 0) {
      gazeTarget.set((Math.random() - 0.5) * 0.22, (Math.random() - 0.5) * 0.16);
      gazeT = 0.8 + Math.random() * 2.2;
    }
    gazeCur.lerp(gazeTarget, 1 - Math.exp(-dt * 12));
    for (const eye of eyeNodes) {
      eye.node.quaternion.copy(eye.restQ);
      eye.node.rotateY(gazeCur.x);
      eye.node.rotateX(gazeCur.y);
    }
  } else {
    gazeCur.lerp(gazeTarget.set(0, 0), 1 - Math.exp(-dt * 8));
  }
  if (vrm && gazeObj) {
    // VRM:讓 lookAt 目標繞著攝影機附近漂移(基本是眼神接觸+微飄)
    gazeObj.position.copy(camera.position);
    gazeObj.position.x += gazeCur.x * 3;
    gazeObj.position.y += gazeCur.y * 3;
  }
  // 頭部微動:有 Head 骨骼(RPM)就轉骨骼,否則轉整個模型(facecap)
  const amp = ck('ckHead') ? 1 : 0;
  const hy = amp * (Math.sin(time * 0.45) * 0.035 + Math.sin(time * 1.1) * 0.012);
  const hx = amp * Math.sin(time * 0.6) * 0.02;
  const hz = amp * Math.sin(time * 0.32) * 0.012;
  if (headBone) {
    headBone.quaternion.copy(headRestQ);
    headBone.rotateY(hy * 2); headBone.rotateX(hx * 2); headBone.rotateZ(hz * 2);
  } else if (model) {
    model.rotation.set(hx, hy, hz);
  }
  return blink;
}

// ---------- 合成:manual + speech + emotion,blink 取 max ----------
function compose(blink, dt) {
  if (mode !== 'compose' || (!vrm && !morphMeshes.length)) return 0;
  // 情緒平滑
  const keys = new Set([...Object.keys(layers.emotionCur), ...Object.keys(layers.emotionTarget)]);
  const k1 = 1 - Math.exp(-dt * 6);
  for (const n of keys) {
    const cur = layers.emotionCur[n] || 0, tgt = layers.emotionTarget[n] || 0;
    const v = cur + (tgt - cur) * k1;
    if (v < 0.001 && tgt === 0) delete layers.emotionCur[n]; else layers.emotionCur[n] = v;
  }

  // --- VRM 路徑:ARKit 空間合成後映射到 VRM 表情 ---
  if (vrm) {
    const em = vrm.expressionManager;
    const ark = {};
    for (const k in layers.speech) ark[k] = (ark[k] || 0) + layers.speech[k];
    for (const k in layers.emotionCur) {
      const w = (a2ePlaying && SPEECH_REGION.test(k)) ? SPEECH_MASK_WEIGHT : 1;
      ark[k] = (ark[k] || 0) + layers.emotionCur[k] * w;
    }
    const vals = arkitToVrm(ark, blink);
    for (const k in layers.manual) vals[k] = (vals[k] || 0) + layers.manual[k];  // slider 直接操作 VRM 名
    let active = 0;
    for (const name of modelKeys) {
      const v = Math.min(1, Math.max(0, vals[name] || 0));
      em.setValue(name, v);
      if (v > 0.01) active++;
    }
    return active;
  }

  const dict0 = morphMeshes[0].morphTargetDictionary;
  // 逐 mesh 寫入 morphTargetInfluences
  let active = 0;
  for (const mesh of morphMeshes) {
    const dict = mesh.morphTargetDictionary, inf = mesh.morphTargetInfluences;
    inf.fill(0);
    for (const k in layers.manual) if (k in dict) inf[dict[k]] += layers.manual[k];
    for (const k in layers.speech) if (k in dict) inf[dict[k]] += layers.speech[k];
    for (const n in layers.emotionCur) {
      const k = resolveKey(dict0, n);
      if (!k || !(k in dict)) continue;
      // 說話中,嘴部/顎/舌以 lipsync 為主,情緒保留一部分權重疊加(而非完全歸零)
      const w = (a2ePlaying && SPEECH_REGION.test(k)) ? SPEECH_MASK_WEIGHT : 1;
      inf[dict[k]] += layers.emotionCur[n] * w;
    }
    if (blink > 0) for (const bk of ['eyeBlink_L', 'eyeBlink_R', 'eyeBlinkLeft', 'eyeBlinkRight'])
      if (bk in dict) inf[dict[bk]] = Math.max(inf[dict[bk]], blink);
    for (let i = 0; i < inf.length; i++) {
      inf[i] = Math.min(1, Math.max(0, inf[i]));
      if (mesh === morphMeshes[0] && inf[i] > 0.01) active++;
    }
  }
  return active;
}

// ---------- 主迴圈 ----------
const hud = document.getElementById('hud');
const clock = new THREE.Clock();
let fpsAcc = 0, fpsN = 0, fpsShow = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.1);
  const time = clock.elapsedTime;

  sampleA2E(dt);
  const blink = idleUpdate(dt, time);
  const active = compose(blink, dt);
  if (mixer) mixer.update(dt);       // bodyAction 一律播放;take clip 只在 mode==='take' 時處於 playing 狀態
  if (vrm) vrm.update(dt);          // 套用表情/lookAt/spring bones(頭髮、衣物物理)

  controls.update();
  renderer.render(scene, camera);

  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { fpsShow = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  hud.textContent =
    `render ${fpsShow} fps\n` +
    `mode   ${mode === 'take' ? '臉捕 take' : (a2ePlaying ? 'A2E JSON 播放中' : 'idle/manual')}\n` +
    `active ${active} morphs` +
    (!vrm && modelKeys.length === 0 ? '\n⚠ 此模型無 blendshapes,無法做表情/口型動畫' : '');
}
resize();
loadModel(MODELS[0].file);
loop();
</script>
