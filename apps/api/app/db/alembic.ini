# Alembic configuration for apps/api.
#
# Kept inside the package (rather than at the app root) so the whole persistence layer
# — models, session, migrations, config — lives under app/db/.
#
# Run from apps/api:
#   alembic -c app/db/alembic.ini upgrade head
#   alembic -c app/db/alembic.ini revision --autogenerate -m "add x"
#
# The database URL is NOT stored here: env.py reads DATABASE_URL through
# app.core.config so there is exactly one source of truth and no credential in git.

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
