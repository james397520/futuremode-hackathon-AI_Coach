[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-coach-api"
version = "0.1.0"
description = "AI Coach — AI Orchestration API (FastAPI). Spec docs/spec/AI_Coach_Spec_v3.md §63/§64."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
  # --- web framework -------------------------------------------------------
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",          # multipart form parsing (§11 upload metadata)
  "orjson>=3.10.0",                   # fast JSON for streaming event payloads (§55)
  # --- validation / settings ----------------------------------------------
  "pydantic>=2.11.0",
  "pydantic-settings>=2.3.0",
  # --- persistence ---------------------------------------------------------
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "redis>=5.0.0",                     # cache + token-bucket rate limit (§40.3/§49.4)
  "qdrant-client>=1.9.0",             # vectors live here, never in Postgres (§74)
  "boto3>=1.34.0",                    # S3/MinIO signed upload URLs (§40.2/§73)
  # --- outbound ------------------------------------------------------------
  "httpx>=0.27.0",
  "tenacity>=8.3.0",                  # retry / exponential backoff (§49.4/§70)
  # --- auth / crypto -------------------------------------------------------
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  # --- observability -------------------------------------------------------
  "structlog>=24.1.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-exporter-otlp-proto-http>=1.25.0",
  # --- async jobs ----------------------------------------------------------
  # Celery (not Dramatiq): the document pipeline (parse -> chunk -> embed -> index,
  # §65) needs chained/grouped tasks with per-step retry, plus periodic beat jobs for
  # the §40.2 retention/deletion sweeps. Celery has canvas (chain/group/chord) and
  # beat built in and reuses the Redis instance we already run (§64), whereas Dramatiq
  # would need extra middleware for both. Broker/result backend = REDIS_URL.
  "celery[redis]>=5.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app"]
extend-exclude = ["../../database/migrations/versions"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "C4",        # comprehensions
  "S",         # bandit (security)
  "A",         # builtin shadowing
  "T20",       # no print()
  "SIM",       # simplify
  "PTH",       # pathlib
  "RUF",       # ruff-specific
  "ASYNC",     # async pitfalls
  "ANN",       # missing annotations
  "TID",       # tidy imports
]
ignore = [
  "ANN401",   # allow `Any` in narrowly-typed adapter seams
  "B008",     # FastAPI Depends(...) in defaults is the idiom
  "S101",     # asserts are used by the tenancy invariant helpers
  "A003",     # `ScopedRepository.list` is a deliberate repository-style method name
  "S105",     # no hardcoded credentials: the flagged constants are the placeholder we
              # *detect* (DEFAULT_JWT_SECRET) and a Lua script named "token bucket"
]

[tool.ruff.lint.per-file-ignores]
"../../database/migrations/*" = ["ANN", "E501", "I001", "E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# mypy — strict, with narrow pragmatic relaxations
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["app"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
exclude = "../../database/migrations/versions/"

[[tool.mypy.overrides]]
# Third-party packages without bundled type information.
module = [
  "jose.*",
  "passlib.*",
  "qdrant_client.*",
  "boto3.*",
  "botocore.*",
  "celery.*",
  "opentelemetry.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Implemented by the Agents & RAG owner (see README "Interface contract").
module = ["app.services.*", "app.agents.*", "app.ws.*", "app.rag.*", "app.workers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning"]
