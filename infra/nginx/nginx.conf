# =============================================================================
# AI Coach — edge proxy.
#
# Spec: §73 (security), §49 (real-time architecture: REST / WebSocket / WebRTC),
#       §96 (bundle strategy), §51–§62 (WebGPU / WASM runtime).
#
# nginx, not Caddy — why
# ---------------------
# Caddy is genuinely nicer for the two things this file is worst at: automatic
# ACME certificates and built-in Brotli. We still chose nginx:
#
#   1. §64 targets a reverse proxy plus "Kubernetes when required", and the de facto
#      ingress there is ingress-nginx. Writing the edge policy in nginx syntax
#      means the location blocks, the WebSocket upgrade map and the header set
#      below port to ingress annotations and a ConfigMap almost verbatim.
#      A Caddyfile would have to be rewritten for the cluster.
#   2. Enterprise / AMD AUP deployments (§72) frequently terminate TLS at a
#      corporate load balancer with certificates from an internal CA. Caddy's
#      headline feature — automatic public ACME — is unusable there, so we would
#      be running Caddy in manual-cert mode and paying its downsides for none of
#      its upside.
#   3. The one real cost is Brotli, which is not in stock nginx. That is handled
#      with an optional module include below rather than by changing proxies.
#
# Scope: this proxy handles two of the three §49 channels — HTTPS REST and the
# session WebSocket. It does NOT handle WebRTC media. SRTP/ICE is UDP and does
# not traverse an HTTP reverse proxy; a WebRTC voice path needs a STUN/TURN
# server (and an SFU if avatar media is ever added), deployed alongside rather
# than behind this. Only WebRTC *signalling* passes through here, over /ws.
#
# Mount at /etc/nginx/nginx.conf and configure the certificate paths below.
# =============================================================================

user  nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# --- optional dynamic modules -------------------------------------------------
# A glob that matches nothing is a no-op in nginx, so this include is safe on
# the stock image and activates Brotli automatically on an image that ships
# ngx_brotli. To enable it:
#
#   * use an image with the module, e.g. `fholzer/nginx-brotli`, or build nginx
#     with `--add-dynamic-module=/path/to/ngx_brotli`; and
#   * mount a file into /etc/nginx/modules-optional/ containing:
#       load_module modules/ngx_http_brotli_filter_module.so;
#       load_module modules/ngx_http_brotli_static_module.so;
#
# The matching http-level directives live in the second glob further down.
include /etc/nginx/modules-optional/*.conf;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- logging --------------------------------------------------------------
    # $request_id is propagated to the API below and is what ties an nginx line
    # to a structured API log line and to an AuditEvent row (§42 / §49.5).
    # Deliberately absent: query strings and request bodies. Session transcripts
    # and knowledge queries are trainee content and must not land in proxy logs
    # (§40 PII handling).
    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
        'rt=$request_time urt=$upstream_response_time '
        'rid=$request_id ua="$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # --- transport ------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    absolute_redirect off;

    keepalive_timeout  75s;
    client_max_body_size 200m;   # §11 document upload ceiling
    client_body_timeout  60s;
    client_header_timeout 30s;
    reset_timedout_connection on;

    upstream web_upstream {
        server 127.0.0.1:3000;
        keepalive 32;
    }
    upstream api_upstream {
        server 127.0.0.1:8000;
        keepalive 32;
    }
    # Local Digital Human runtime (avatar spec §39). It binds to loopback and is
    # never exposed directly; the browser reaches it same-origin via /avatar/.
    # `max_fails=0` on purpose: nginx must not eject this upstream on a blip,
    # because the client is required to degrade gracefully rather than be told
    # the whole route is down (avatar spec §53).
    upstream avatar_upstream {
        server 127.0.0.1:8765 max_fails=0;
        keepalive 8;
    }

    # --- compression ----------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/manifest+json
        application/wasm
        image/svg+xml
        font/woff font/woff2;
    # NOTE: application/wasm is listed on purpose. The WASM fallback backend
    # (§62) ships multi-megabyte .wasm payloads and they compress well. Do not
    # add image/png, image/jpeg or audio/* — already compressed, and gzipping
    # them just burns CPU on the edge.

    # Brotli directives, applied only if the module loaded above. Same
    # match-nothing-is-fine glob trick.
    include /etc/nginx/brotli-optional/*.conf;

    # --- WebSocket upgrade ----------------------------------------------------
    # The canonical map. `Connection: upgrade` must only be sent when the client
    # actually asked for it; hardcoding it breaks plain HTTP keep-alive on the
    # same location.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- rate limiting (§40.3 / §73) ------------------------------------------
    limit_req_zone  $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=api_auth:10m    rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # --- TLS ------------------------------------------------------------------
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-Id      $request_id;

    # =========================================================================
    # :80 — redirect only. HTTPS only, per §73.
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Load-balancer health check; must answer before certificates exist.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        # ACME http-01, when a public ACME client is in play.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # :443 — the application.
    # =========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # ---------------------------------------------------------------------
        # §73 security headers.
        #
        # `always` matters: without it these are dropped on 4xx/5xx, which is
        # precisely when an error page might be framed or sniffed.
        #
        # Content-Security-Policy is DELIBERATELY NOT SET HERE for the web
        # upstream. apps/web/next.config.mjs already emits a CSP tuned for the
        # local-inference runtime ('wasm-unsafe-eval', worker-src blob:). Two
        # CSP headers are enforced as the *intersection* of both policies, so
        # adding a second one here would silently break the WebGPU/WASM worker
        # in a way that only reproduces behind the proxy. The API gets its own
        # narrow CSP in its location block below.
        # ---------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "microphone=(self), camera=(self), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # =====================================================================
        # CROSS-ORIGIN ISOLATION — read this before changing it.
        #
        # The pair
        #     Cross-Origin-Opener-Policy:   same-origin
        #     Cross-Origin-Embedder-Policy: require-corp
        # is what makes the document "cross-origin isolated". That is a hard
        # requirement for SharedArrayBuffer, which is in turn a hard requirement
        # for **multi-threaded WASM inference** — the §62 fallback backend. With
        # it, ONNX Runtime Web's WASM EP runs on N threads; without it, it is
        # pinned to one thread and the fallback path becomes unusably slow on
        # exactly the locked-down enterprise browsers it exists to serve (§51).
        # WebGPU itself does not need isolation; the WASM tier does.
        #
        # THE TRADEOFF, stated plainly:
        # COEP: require-corp makes the browser REFUSE every cross-origin
        # subresource that does not opt in — with
        #     Cross-Origin-Resource-Policy: cross-origin  (server-set), or
        #     crossorigin="anonymous" + permissive CORS.
        # Things that break the day you turn this on:
        #   * third-party fonts, avatars, CDN images, analytics pixels
        #   * <iframe> embeds (help widgets, SSO consent screens, video)
        #   * ElevenLabs / OpenAI audio streamed *directly* from a provider URL
        #     to an <audio> element. This is not a problem for us today, because
        #     §71 routes TTS through the Voice Session Service on our own origin
        #     rather than handing the browser a provider URL — but if anyone
        #     "optimises" that into a direct provider fetch, it will fail here
        #     first, and the console error will name COEP.
        #
        # HOW TO OPT A ROUTE OUT
        # Isolation is per-document, so a single route can be excused without
        # weakening the app. Preferred order:
        #
        #   1. credentialless — keep isolation, drop the CORP requirement for
        #      no-cors subresources (they are just fetched without credentials).
        #      Supported in Chromium and Firefox; Safari falls back to blocking.
        #        location /app/integrations/ {
        #            add_header Cross-Origin-Embedder-Policy "credentialless" always;
        #            add_header Cross-Origin-Opener-Policy   "same-origin" always;
        #            proxy_pass http://web_upstream;
        #        }
        #
        #   2. Drop isolation entirely for that route. Do this for pages that
        #      must embed third-party frames (an SSO consent screen, an embedded
        #      LMS view — §43 Integrations) and that do not run local inference:
        #        location /app/integrations/oauth/ {
        #            add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
        #            add_header Cross-Origin-Opener-Policy   "same-origin-allow-popups" always;
        #            proxy_pass http://web_upstream;
        #        }
        #      `same-origin-allow-popups` is the specific COOP value an OAuth
        #      popup flow needs; plain `same-origin` severs window.opener and
        #      the popup can never hand the token back.
        #
        #   3. Proxy the offending asset through our own origin. Best long-term
        #      answer for fonts and avatars, and it also satisfies the §73 CSP.
        #
        # Because a `location` block that sets ANY add_header replaces the whole
        # inherited set, each opt-out above must re-state the headers it still
        # wants. That is nginx's add_header inheritance rule, not a typo.
        # =====================================================================
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        # ---------------------------------------------------------------------
        # Session WebSocket (§49 Part II, §55 streaming events).
        # ---------------------------------------------------------------------
        location /ws {
            limit_conn ws_conn 8;   # a trainee needs one; 8 covers tabs + reconnect overlap

            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $request_id;

            # A live simulation can sit quiet while the trainee thinks. The read
            # timeout has to outlast that silence or the socket dies mid-session
            # and the client burns a reconnect (connection.reconnecting, §55).
            # The API is expected to heartbeat well inside this window.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_connect_timeout 10s;

            # Streaming events must not be batched by the proxy; §95 requires
            # partial transcript to reach the UI immediately.
            proxy_buffering off;
            tcp_nodelay on;

            # add_header does not inherit into a location that sets its own, so
            # the isolation pair is re-stated. Harmless on a WS response, and it
            # keeps the policy identical if this route ever serves HTML.
            add_header Cross-Origin-Opener-Policy   "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        }

        # ---------------------------------------------------------------------
        # Avatar Runtime (avatar spec §37–§45). Same-origin on purpose: serving it
        # under /avatar/ keeps the page's existing connect-src 'self' valid, so no
        # extra CSP origin is needed in production.
        #
        # Carries both the control WebSocket (/avatar/ws/sessions/{id}) and the
        # binary video frames, so the upgrade headers and the long read timeout
        # apply to the whole prefix.
        # ---------------------------------------------------------------------
        location /avatar/ {
            limit_conn ws_conn 8;

            # Strip the prefix: the runtime serves /health, /sessions, /ws/... at root.
            proxy_pass http://avatar_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $request_id;

            # A session holds the socket open for its whole duration, and the avatar
            # is silent whenever the trainee is speaking.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            # Model load + warmup on a cold cache can be slow; failing the connect
            # here would surface as an avatar outage rather than a slow start.
            proxy_connect_timeout 30s;

            # Frames are latency-critical: never let the proxy batch them (§17 audio
            # clock, §49 frame scheduler — a buffered frame is a late frame, and a
            # late frame gets dropped rather than queued).
            proxy_buffering off;
            tcp_nodelay on;

            # Avatar media must not be cached anywhere in the path; it is per-session
            # and, for a licensed likeness, must not persist on an intermediary (§73).
            add_header Cache-Control "no-store" always;
            add_header Cross-Origin-Opener-Policy   "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        }

        # ---------------------------------------------------------------------
        # Auth endpoints — tighter rate limit (§40.3, credential stuffing).
        # ---------------------------------------------------------------------
        location ~ ^/api/v1/auth/(login|refresh|password) {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://api_upstream;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-store" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ---------------------------------------------------------------------
        # REST API (§56).
        # ---------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_general burst=40 nodelay;

            proxy_pass http://api_upstream;
            proxy_read_timeout 120s;    # LLM turns and report generation are slow
            proxy_send_timeout 120s;

            # SSE-style incremental responses exist on some report/generation
            # endpoints; buffering would defeat them.
            proxy_buffering off;

            # API responses are JSON data, never a document the browser should
            # frame, script or cache.
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            # A narrow CSP is safe here (no HTML is served) and blocks the
            # "JSON rendered as a page" class of XSS.
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; sandbox" always;
        }

        # ---------------------------------------------------------------------
        # Next.js immutable build output. Content-hashed, so cache hard.
        # ---------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://web_upstream;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Cross-Origin-Opener-Policy   "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            # Same-origin already, but explicit: these are the module chunks the
            # isolated document loads, and COEP judges every one of them.
            add_header Cross-Origin-Resource-Policy "same-origin" always;
        }

        # ---------------------------------------------------------------------
        # Local-inference model artefacts (§60 model lifecycle, §96 bundle).
        # Multi-megabyte ONNX/WASM files, content-addressed by the manifest's
        # sha256, so they are immutable and long-cached. Kept in its own
        # location because the header and caching needs differ from both HTML
        # and the JS chunks.
        # ---------------------------------------------------------------------
        location /models/ {
            proxy_pass http://web_upstream;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Cross-Origin-Opener-Policy   "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            # Range requests let the runtime resume a partial model download
            # instead of restarting a 90 MB fetch.
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_buffering off;
        }

        # ---------------------------------------------------------------------
        # Everything else → Next.js.
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://web_upstream;
            proxy_read_timeout 60s;
            add_header Cross-Origin-Opener-Policy   "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=(), payment=(), usb=()" always;
        }

        # Do not leak nginx's own error pages, which carry version-shaped hints.
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            add_header Content-Type text/plain always;
            return 503 "service unavailable\n";
        }
    }
}
