# =============================================================================
# AI Coach — local development stack
#
# Spec: docs/spec/AI_Coach_Spec_v3.md §64 (Backend Stack), §5.1 (production-grade
#       end-to-end architecture), §74 (Data Isolation).
#
# Layout
#   default profile  : data plane only — postgres / redis / qdrant / minio.
#                      This is what `pnpm infra:up` starts. You then run the API
#                      and the web app on the host (`pnpm api:dev`, `pnpm dev`)
#                      so you keep hot reload.
#   profile "app"    : api + worker + web built from infra/docker/*.Dockerfile.
#                      Use it to reproduce a production-ish container run.
#   profile "proxy"  : nginx TLS terminator in front of web + api.
#
#   docker compose up -d
#   docker compose --profile app up -d --build
#   docker compose --profile app --profile proxy up -d
#
# A note on env files
#   Compose resolves `${VAR}` interpolation from the *project directory*, which
#   defaults to the directory holding this file (`infra/`) — NOT the repository
#   root. So every interpolation below carries a `:-default` that matches the
#   root `.env.example`, and the containers that need real values read the root
#   file explicitly via `env_file: .env`. Nothing here breaks if the root
#   `.env` is missing; you just get the documented defaults.
#
#   `env_file` values are overridden by the `environment:` block, which is how
#   we rewrite `localhost` host URLs from `.env` into in-network service names.
# =============================================================================

name: ai-coach

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — relational source of truth (§53 entities, §64).
  # Vectors never live here; they live in Qdrant (§74).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ai-coach-postgres
    <<: [*restart, *logging]
    environment:
      # Superuser bootstrap. The init script below is what actually guarantees
      # the *application* role/database exist, so this stays reproducible even
      # if you point POSTGRES_USER at a different superuser name.
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # Consumed by ./infra/docker/postgres/init/01-init-db.sh
      APP_DB_NAME: ${POSTGRES_DB:-aicoach}
      APP_DB_USER: ${POSTGRES_USER:-aicoach}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-aicoach}
      APP_DB_TEST_NAME: ${POSTGRES_TEST_DB:-aicoach_test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty data directory. `./scripts/reset.sh` drops the
      # volume, which is what makes edits to the init script take effect.
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-aicoach}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis 7 — cache, rate-limit token buckets (§40.3), Celery broker + result
  # backend for the document pipeline (§65), and the WS gateway pub/sub fan-out
  # that lets more than one API replica serve one session (§49.3).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai-coach-redis
    <<: [*restart, *logging]
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "512mb"
      # Never silently evict a Celery task payload: fail the write instead.
      - --maxmemory-policy
      - "noeviction"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Qdrant — production vector store (§12.2, ADR-0005). Every point carries
  # tenant_id / workspace_id / knowledge_base_id in its payload (§74); the
  # payload indexes for those keys are created by the API on startup, not here.
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: ai-coach-qdrant
    <<: [*restart, *logging]
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}
      # Empty in local dev; set QDRANT_API_KEY in .env for anything shared.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    # The Qdrant image ships neither curl nor wget, so we probe the HTTP port
    # with bash's /dev/tcp instead of fetching /readyz. If a future image drops
    # bash too, replace this with a `qdrant/qdrant` sidecar running
    # `curl -f http://qdrant:6333/readyz` — do not delete the healthcheck, the
    # `depends_on: service_healthy` chain below relies on it.
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage (§64) for uploaded source documents,
  # generated report PDFs and session audio. All browser access goes through
  # signed URLs issued by the API (§73); the bucket itself stays private.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: ai-coach-minio
    <<: [*restart, *logging]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_PORT:-9001}
    ports:
      - "${MINIO_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      # `mc ready local` is MinIO's own documented container probe and ships
      # inside the server image.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------
  # One-shot bucket creation. Exits 0; downstream services wait on
  # `service_completed_successfully` rather than a healthcheck.
  # Idempotent — safe to re-run on every `up`.
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: ai-coach-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-ai-coach}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        # Private by default. Objects reach the browser only via signed URLs (§73).
        mc anonymous set none "local/$$S3_BUCKET"
        # Versioning gives us DocumentVersion-level recoverability (§11 / §53)
        # independently of the Postgres row, and protects against a bad re-parse.
        mc version enable "local/$$S3_BUCKET" || \
          echo "note: versioning unavailable on this backend; continuing"
        # Transient derivatives (extracted page images, OCR intermediates)
        # expire so local disks do not grow without bound.
        mc ilm rule add --expire-days 30 --prefix "tmp/" "local/$$S3_BUCKET" 2>/dev/null || true
        echo "minio-init: bucket '$$S3_BUCKET' ready"
    restart: "no"

  # ===========================================================================
  # Application services — profile "app".
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # AI Orchestration API (§63). Stateless: session continuity lives in Postgres
  # plus Redis, so replicas are interchangeable (§49.3).
  # ---------------------------------------------------------------------------
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: ai-coach/api:local
    container_name: ai-coach-api
    <<: [*restart, *logging]
    env_file:
      - path: .env
        required: false
    environment:
      # Rewrite the host-oriented URLs from .env onto the compose network.
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aicoach}:${POSTGRES_PASSWORD:-aicoach}@postgres:5432/${POSTGRES_DB:-aicoach}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-ai-coach}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Async worker — the document pipeline (parse → chunk → embed → index, §65)
  # and post-session evaluation (§26/§27). Same image as the API so the domain
  # models and RAG code cannot drift between the two.
  # ---------------------------------------------------------------------------
  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    image: ai-coach/worker:local
    container_name: ai-coach-worker
    <<: [*restart, *logging]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aicoach}:${POSTGRES_PASSWORD:-aicoach}@postgres:5432/${POSTGRES_DB:-aicoach}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-ai-coach}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
      CELERY_QUEUES: ${CELERY_QUEUES:-documents,evaluation,maintenance}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # Celery's own liveness probe: the worker answers its control ping over
      # the broker. Cheap, and it fails if the broker connection is dead.
      # `$$(hostname)` — the doubled `$` escapes compose interpolation, and
      # `hostname` is used rather than $HOSTNAME because /bin/sh does not set
      # that variable. Scoping to this container's node name means a healthy
      # sibling worker cannot mask a dead one.
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Next.js web app (§48.1). Runs the standalone server; no build tooling in
  # the runtime image.
  # ---------------------------------------------------------------------------
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined at build time, so they are build args, not
        # runtime env. Changing them requires a rebuild — that is a Next.js
        # property, not an oversight.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-ws://localhost:8000}
        NEXT_PUBLIC_ENABLE_WEBGPU: ${NEXT_PUBLIC_ENABLE_WEBGPU:-auto}
    image: ai-coach/web:local
    container_name: ai-coach-web
    <<: [*restart, *logging]
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Non-5xx from the app root. apps/web has no health route yet; when it
      # does, set WEB_HEALTH_PATH here and the image probe follows.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Edge proxy — profile "proxy". TLS termination, WebSocket upgrade, security
  # headers and cross-origin isolation (see infra/nginx/nginx.conf).
  # ---------------------------------------------------------------------------
  proxy:
    profiles: ["proxy"]
    image: nginx:1.27-alpine
    container_name: ai-coach-proxy
    <<: [*restart, *logging]
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Drop fullchain.pem / privkey.pem here. `scripts/bootstrap.sh
      # --with-proxy` mints a local self-signed pair if the directory is empty.
      - ./infra/certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
  nginx-cache:

networks:
  default:
    name: ai-coach
