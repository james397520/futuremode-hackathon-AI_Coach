[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-coach-local-tts"
version = "0.1.0"
description = "AI Coach — local Traditional-Chinese TTS model server (Kokoro-82M-v1.1-zh on onnxruntime, loopback only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
  # --- web framework -------------------------------------------------------
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "orjson>=3.10.0",
  # --- validation / settings ----------------------------------------------
  "pydantic>=2.11.0",
  "pydantic-settings>=2.3.0",
  # --- inference -----------------------------------------------------------
  # CPU onnxruntime, not torch: the same 82M-parameter graph, ~200 MB less on
  # disk and ~400 MB less resident, which matters on an 8 GB laptop that is also
  # running the API, the STT daemon and a browser.
  "onnxruntime>=1.20.0",
  "numpy>=1.26.0",
  # misaki is Kokoro's own G2P; the [zh] extra is jieba + pypinyin + cn2an.
  "misaki[zh]>=0.9.4",
  # --- observability -------------------------------------------------------
  "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Same ruff configuration as apps/api so the two Python trees lint identically.
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "S", "A", "T20", "SIM", "PTH", "RUF", "ASYNC", "ANN", "TID"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # zh-TW punctuation in strings/comments is correct, not ambiguous
  "ANN401",
  "B008",
  "S101",
  "S603", "S607",  # ffmpeg is invoked with a fixed argv, never a shell string
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
