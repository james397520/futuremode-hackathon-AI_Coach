[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-coach-avatar-runtime"
version = "0.1.0"
description = "AI Coach — local Digital Human / Avatar Runtime (LivePortrait expression + MuseTalk lip sync). Spec LivePortrait_MuseTalk_CrossPlatform_Implementation_Spec §0-§91."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# ---------------------------------------------------------------------------
# The dependency list is deliberately tiny.
#
# §53 ("Avatar 故障不得終止 AI Training Session") is only credible if this
# service starts on a laptop with nothing accelerated installed. So the *only*
# runtime requirements are a web framework, settings/validation, numpy for the
# compositor maths, and logging/metrics. Every engine — MLX, CUDA, TensorRT,
# onnxruntime, OpenCV, aiortc, Pillow — is behind a lazy import inside a port
# implementation and lives in an optional extra. `uvicorn app.main:app` works
# with just this list, serving /health, /capabilities and static-portrait
# frames over WebSocket.
# ---------------------------------------------------------------------------
dependencies = [
  # --- web framework -------------------------------------------------------
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",        # [standard] brings the websockets impl
  "orjson>=3.10.0",
  "python-multipart>=0.0.9",          # POST /avatars is multipart (§41)
  # --- validation / settings ----------------------------------------------
  "pydantic>=2.11.0",
  "pydantic-settings>=2.3.0",
  # --- numerics ------------------------------------------------------------
  # The whole compositor (§22/§23) and the static-portrait backend are numpy
  # only, on purpose: they are the §53 floor and must be unit-testable with no
  # engine present.
  "numpy>=1.26.0",
  "pyyaml>=6.0.1",                    # configs/{default,mac,rtx}.yaml (§54/§55)
  # --- observability -------------------------------------------------------
  "structlog>=24.1.0",
  "prometheus-client>=0.20.0",        # soft dependency; see app/core/metrics.py
]

[project.optional-dependencies]
# Real JPEG/WebP encoding for the §37 Phase-1 WebSocket path. Without it the
# encoder falls back to a stdlib-zlib PNG writer, which is slower but always
# available — the transport never becomes the reason a session cannot start.
images = ["pillow>=10.3.0"]

# §38 Phase 2. Absent aiortc degrades to the WebSocket frame path with a logged
# reason; it never blocks startup.
webrtc = ["aiortc>=1.9.0", "av>=12.0.0"]

# Apple Silicon (§24). The LivePortrait / MuseTalk MLX runtimes themselves are
# *not* installed from PyPI — they are pinned git checkouts, see README
# "Engine ports". This extra only provides the MLX array framework that the
# port implementations import lazily.
mac = ["mlx>=0.16.0"]

# NVIDIA RTX (§29). torch/tensorrt are installed out-of-band from NVIDIA's own
# index per README; onnxruntime-gpu is the one piece that is pip-installable.
rtx = ["onnxruntime-gpu>=1.18.0"]

dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "mypy>=1.10.0",
  "ruff>=0.5.0",
]

[project.scripts]
avatar-prepare = "scripts.prepare_avatar:main"
avatar-build-bank = "scripts.build_expression_bank:main"
avatar-benchmark = "scripts.benchmark:main"
avatar-verify = "scripts.verify_install:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = []
